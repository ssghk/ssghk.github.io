<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>會員系統</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>
  <div id="main"></div>
  <script>
    
    // 填入你的 firebaseConfig
        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyAe9fiJ-awc_QcHaT_GjrcYnSSGhl-weLM",
            authDomain: "ssg1111.firebaseapp.com",
            projectId: "ssg1111",
            storageBucket: "ssg1111.firebasestorage.app",
            messagingSenderId: "645347114148",
            appId: "1:645347114148:web:a380b5bf76f659c7e47a31",
            measurementId: "G-EH0Z16872Q"
        };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 取得網址參數
    const params = new URLSearchParams(location.search);
    const userParam = params.get('user');
    const getParam = params.get('get');

    console.log('functions:', firebase.functions());
    if (getParam) {
  const uid = getParam;
  const incrementCount = firebase.functions().httpsCallable('incrementCount');
  incrementCount({ uid }).then(result => {
    location.href = result.data.url;
  }).catch(e => {
    document.getElementById('main').textContent = '計數失敗';
  });
}else if (userParam) {
      // 公開頁：顯示會員名字（VIP才可瀏覽）
      const uid = userParam;
      db.collection('users').doc(uid).get().then(doc => {
        if (doc.exists && doc.data().vip) {
          document.getElementById('main').textContent = doc.data().name;
        } else {
          document.getElementById('main').textContent = '商家準備中...';
        }
      });
    } else {
      // 會員主頁
      document.getElementById('main').innerHTML = `
        <button id="loginBtn">Google登入</button>
        <div id="userPanel" style="display:none">
          <button id="showPrivacyBtn">💰</button>
          <div id="商家私隱" style="display:none">
            <div>商家：<span id="name"></span></div>
            <div>VIP：<span id="vip"></span></div>
            <div style="display:none">獨立網址：<span id="url"></span></div>
            <div style="display:none">獨立網址Get：<span id="geturl"></span></div>
            <div>本月發出消費劵數：<span id="month"></span></div>
            <div>累計發出消費劵數：<span id="total"></span></div>
            <div>客戶每次使用相機掃qr獲取消費劵，店主將消費1元</div>
            <button id="logoutBtn">登出</button>
          </div>
          <div id="qr位">請客戶使用相機掃qr獲取消費劵：<canvas id="qrcode"></canvas></div>
        </div>
      `;
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const userPanel = document.getElementById('userPanel');
      loginBtn.onclick = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
      };
      logoutBtn.onclick = () => auth.signOut();
      auth.onAuthStateChanged(async user => {
      // 商家私隱顯示按鈕
      const showPrivacyBtn = document.getElementById('showPrivacyBtn');
      const privacyPanel = document.getElementById('商家私隱');
      showPrivacyBtn.onclick = () => {
        privacyPanel.style.display = '';
        showPrivacyBtn.style.display = 'none';
      };
        if (!user) {
          userPanel.style.display = 'none';
          loginBtn.style.display = '';
          return;
        }
        loginBtn.style.display = 'none';
        userPanel.style.display = '';
        const uid = user.uid;
        const userRef = db.collection('users').doc(uid);
        let doc = await userRef.get();
        if (!doc.exists) {
          const url = location.origin + location.pathname + '?user=' + uid;
          const geturl = location.origin + location.pathname + '?get=' + uid;
          await userRef.set({
            name: user.displayName,
            vip: false,
            url, geturl,
            month: 0, total: 0
          });
          doc = await userRef.get();
        }
        const data = doc.data();
        document.getElementById('name').textContent = data.name;
        document.getElementById('url').textContent = data.url;
        document.getElementById('geturl').textContent = data.geturl;
        document.getElementById('vip').textContent = data.vip ? '是' : '否';
        document.getElementById('month').textContent = data.month || 0;
        document.getElementById('total').textContent = data.total || 0;
        const qrDiv = document.getElementById('qr位');
        const qrcodeEl = document.getElementById('qrcode');
        if (data.vip) {
          // VIP顯示QRCode
          if (qrcodeEl.tagName === 'A') {
            const newCanvas = document.createElement('canvas');
            newCanvas.id = 'qrcode';
            qrDiv.replaceChild(newCanvas, qrcodeEl);
            QRCode.toCanvas(newCanvas, data.geturl);
          } else {
            qrcodeEl.style.display = '';
            QRCode.toCanvas(qrcodeEl, data.geturl);
          }
        } else {
          // 非VIP顯示a href
          if (qrcodeEl.tagName === 'CANVAS') {
            const a = document.createElement('a');
            a.id = 'qrcode';
            a.href = 'https://wa.me/85264071181/?text=莫生我要vip3';
            a.textContent = '成為vip,派發您的消費劵，(客戶每次獲取消費劵，您將支付1元)';
            a.target = '_blank';
            qrDiv.replaceChild(a, qrcodeEl);
          } else {
            qrcodeEl.style.display = '';
            qrcodeEl.href = 'https://wa.me/85264071181/?text=莫生我要vip3';
            qrcodeEl.textContent = '成為vip,派發您的消費劵，(客戶每次獲取消費劵，您將支付1元)';
            qrcodeEl.target = '_blank';
          }
        }
      });
    }

    /*
    
    rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{userId} {
      allow read: if true;
      // 只允許 Cloud Function 寫入 month、total、monthKey
      allow update: if request.auth != null &&
        request.auth.token.firebase.sign_in_provider == 'custom' &&
        request.resource.data.keys().hasOnly(['month', 'total', 'monthKey']);
      // 會員本人不可修改任何欄位
      allow write: if false;
    }
  }
}
    
    */
  </script>
</body>
</html>
