    // 設定SEO資訊
    function setSEO(site) {
      if (site) {
        if (site.name) document.title = site.name;
        if (site.logo) {
          let favicon = document.getElementById('dynamicFavicon');
          if (favicon) favicon.href = site.logo;
        }
        if (site.desc) {
          let desc = document.getElementById('dynamicDesc');
          if (desc) desc.setAttribute('content', site.desc);
        }
      }
    }
    // 共用網站資料渲染 function
    function renderSiteInfo(site) {
      setSEO(site);
      let html = '';
      if (site.logo) html += `<div><img src='${site.logo}' style='max-width:120px;'></div>`;
      if (site.name) html += `<div style='font-size:1.2em;font-weight:bold;'>${site.name}</div>`;
      if (site.address) html += `<div>地址：${site.address}</div>`;
      if (site.phone) html += `<div>電話：${site.phone}</div>`;
      if (site.desc) html += `<div>${site.desc}</div>`;
      return html ? `<div id="siteInfo" style="margin-bottom:1em;">${html}</div>` : '';
    }

    // 共用廣告渲染/取得 function
    function renderAds(ads, adsList, removeCb) {
      adsList.innerHTML = '';
      (ads || []).forEach((ad, i) => {
        const adDiv = document.createElement('div');
        adDiv.style = 'border:1px solid #ccc;margin:8px 0;padding:4px;';
        adDiv.innerHTML = `
          <div>消費劵圖片網址：<input type="text" value="${ad.img||''}" data-idx="${i}" class="ad-img"></div>
          <div>消費劵名：<input type="text" value="${ad.title||''}" data-idx="${i}" class="ad-title"></div>
          <div>消費劵條款：<input type="text" value="${ad.desc1||''}" data-idx="${i}" class="ad-desc1"></div>
          <div>消費劵地址或網址：<input type="text" value="${ad.desc2||''}" data-idx="${i}" class="ad-desc2"></div>
          <button class="removeAdBtn" data-idx="${i}">移除</button>
        `;
        adsList.appendChild(adDiv);
      });
      adsList.querySelectorAll('.removeAdBtn').forEach(btn => {
        btn.onclick = () => {
          const idx = +btn.getAttribute('data-idx');
          removeCb(idx);
        };
      });
    }
    function getCurrentAds(adsList) {
      return Array.from(adsList.querySelectorAll('.ad-img')).map((imgInput, i) => ({
        img: imgInput.value,
        title: adsList.querySelector(`.ad-title[data-idx="${i}"]`).value,
        desc1: adsList.querySelector(`.ad-desc1[data-idx="${i}"]`).value,
        desc2: adsList.querySelector(`.ad-desc2[data-idx="${i}"]`).value
      }));
    }

    // get 參數流程

        location.href = result.data.url;
      }).catch(e => {
        document.getElementById('main').textContent = '計數失敗';
      });
    }

    // admin 頁流程
    function renderAdminPage() {
      window.addEventListener('DOMContentLoaded', function() {
        auth.onAuthStateChanged(async user => {
          const adminUid = '109EjNOTmkh2CRuLghiIuwTDzl02';
          if (!user || user.uid !== adminUid) {
            document.getElementById('main').textContent = '無權限';
            return;
          }
          // 取得網站資料
          const siteDoc = await db.collection('site').doc('main').get();
          const site = siteDoc.exists ? siteDoc.data() : {};
          let html = '<h3>網站資料管理</h3>';
          html += `
            <div style="border:1px solid #888;margin:8px 0;padding:4px;">
              <div>本公司logo網址：<input type="text" id="site_logo" value="${site.logo||''}" style="width:60%"></div>
              <div>本公司名：<input type="text" id="site_name" value="${site.name||''}"></div>
              <div>本公司地址：<input type="text" id="site_address" value="${site.address||''}"></div>
              <div>本公司電話：<input type="text" id="site_phone" value="${site.phone||''}"></div>
              <div>本公司描述：<input type="text" id="site_desc" value="${site.desc||''}" style="width:80%"></div>


              <button id="saveSiteBtn">儲存網站資料</button>
            </div>
            <h3>會員管理</h3>`;
          // 取得所有會員
          const snap = await db.collection('users').get();
          snap.forEach(doc => {
            const d = doc.data();
            let adsHtml = '';
            const ads = Array.isArray(d.ads) ? d.ads : [];
            ads.forEach((ad, i) => {
              adsHtml += `<div style='border:1px dashed #aaa;margin:4px 0;padding:2px;'>
                <div>消費劵圖片網址：<input type='text' class='ad-img' data-uid='${doc.id}' data-idx='${i}' value='${ad.img||''}'></div>
                <div>消費劵名：<input type='text' class='ad-title' data-uid='${doc.id}' data-idx='${i}' value='${ad.title||''}'></div>
                <div>消費劵條款：<input type='text' class='ad-desc1' data-uid='${doc.id}' data-idx='${i}' value='${ad.desc1||''}'></div>
                <div>消費劵地址或網址：<input type='text' class='ad-desc2' data-uid='${doc.id}' data-idx='${i}' value='${ad.desc2||''}'></div>
                <button class='removeAdBtn' data-uid='${doc.id}' data-idx='${i}'>移除</button>
              </div>`;
            });
            adsHtml += `<button class='addAdBtn' data-uid='${doc.id}'>新增消費劵</button>`;
            html += `<div style="border:1px solid #ccc;margin:8px 0;padding:4px;">
              (${doc.id})<br>


              商家名稱: <input type="text" class="shopName" data-uid="${doc.id}" value="${d.name||''}"><br>
              VIP: <input type="checkbox" class="vip" data-uid="${doc.id}" ${d.vip ? 'checked' : ''}><br>
              商家電話: <input type="text" class="phone" data-uid="${doc.id}" value="${d.phone||''}"><br>
              商家地址: <input type="text" class="address" data-uid="${doc.id}" value="${d.address||''}"><br>
              商家logo: <input type="text" class="logo" data-uid="${doc.id}" value="${d.logo||''}"><br>
              <a href="${d.url}" target="_blank">商家網址</a><br>
              <div>消費劵管理：${adsHtml}</div>
              <button class="editUser" data-uid="${doc.id}">儲存</button>
            </div>`;
          });
          document.getElementById('main').innerHTML = html;
          callTranslate();
          // 儲存網站資料
          document.getElementById('saveSiteBtn').onclick = async () => {
            const logo = document.getElementById('site_logo').value;
            const name = document.getElementById('site_name').value;
            const address = document.getElementById('site_address').value;
            const phone = document.getElementById('site_phone').value;
            const desc = document.getElementById('site_desc').value;
            await firebase.firestore().collection('site').doc('main').set({logo, name, address, phone, desc});
            alert('已更新');
          };
          // 綁定會員儲存按鈕
          document.querySelectorAll('.editUser').forEach(btn => {
            btn.onclick = async () => {
              const uid = btn.getAttribute('data-uid');
              const vip = document.querySelector(`.vip[data-uid='${uid}']`).checked;
              const phone = document.querySelector(`.phone[data-uid='${uid}']`).value;
              const address = document.querySelector(`.address[data-uid='${uid}']`).value;
              const logo = document.querySelector(`.logo[data-uid='${uid}']`).value;
              const name = document.querySelector(`.shopName[data-uid='${uid}']`).value;
              // 取得所有廣告內容
              const userDiv = btn.closest('div[style*="border:1px solid"]');
              let ads = Array.from(userDiv.querySelectorAll('.ad-img')).map((imgInput, i) => ({
                img: imgInput.value,
                title: userDiv.querySelector(`.ad-title[data-idx='${i}']`).value,
                desc1: userDiv.querySelector(`.ad-desc1[data-idx='${i}']`).value,
                desc2: userDiv.querySelector(`.ad-desc2[data-idx='${i}']`).value
              }));
              btn.disabled = true;
              btn.textContent = '儲存中...';
              try {
                // 呼叫 Cloud Function
                const adminUpdateUser = firebase.functions().httpsCallable('adminUpdateUser');
                await adminUpdateUser({ uid, update: { vip, phone, address, logo, ads, name } });
                alert('已更新');
              } finally {
                btn.disabled = false;
                btn.textContent = '儲存';
              }
            };
          });
          // 綁定會員新增廣告按鈕
          document.querySelectorAll('.addAdBtn').forEach(btn => {
            btn.onclick = () => {
              const uid = btn.getAttribute('data-uid');
              const userDiv = btn.closest('div[style*="border:1px solid"]');
              // 取得現有廣告
              let ads = Array.from(userDiv.querySelectorAll('.ad-img')).map((imgInput, i) => ({
                img: imgInput.value,
                title: userDiv.querySelector(`.ad-title[data-idx='${i}']`).value,
                desc1: userDiv.querySelector(`.ad-desc1[data-idx='${i}']`).value,
                desc2: userDiv.querySelector(`.ad-desc2[data-idx='${i}']`).value
              }));
              // 新增一個空廣告
              ads.push({img:'',title:'',desc1:'',desc2:''});
              renderAdminAds(userDiv, uid, ads);
            };

          // 新增一個渲染函數，專門處理該會員廣告區塊的渲染與事件
          function renderAdminAds(userDiv, uid, ads) {
            let adsHtml = '';
            ads.forEach((ad, i) => {
              adsHtml += `<div style='border:1px dashed #aaa;margin:4px 0;padding:2px;'>
                <div>消費劵圖片網址：<input type='text' class='ad-img' data-uid='${uid}' data-idx='${i}' value='${ad.img||''}'></div>
                <div>消費劵名：<input type='text' class='ad-title' data-uid='${uid}' data-idx='${i}' value='${ad.title||''}'></div>
                <div>消費劵條款：<input type='text' class='ad-desc1' data-uid='${uid}' data-idx='${i}' value='${ad.desc1||''}'></div>
                <div>消費劵地址或網址：<input type='text' class='ad-desc2' data-uid='${uid}' data-idx='${i}' value='${ad.desc2||''}'></div>
                <button class='removeAdBtn' data-uid='${uid}' data-idx='${i}'>移除</button>
              </div>`;
            });
            adsHtml += `<button class='addAdBtn' data-uid='${uid}'>新增廣告</button>`;
            userDiv.querySelector('div').innerHTML = '廣告管理：' + adsHtml;
            // 綁定移除事件
            userDiv.querySelectorAll('.removeAdBtn').forEach(rbtn => {
              rbtn.onclick = () => {
                const idx = +rbtn.getAttribute('data-idx');
                ads.splice(idx, 1);
                renderAdminAds(userDiv, uid, ads);
              };
            });
            // 綁定新增事件
            userDiv.querySelectorAll('.addAdBtn').forEach(abtn => {
              abtn.onclick = () => {
                ads.push({img:'',title:'',desc1:'',desc2:''});
                renderAdminAds(userDiv, uid, ads);
              };
            });
          }
          });
        });
      });
    }

    // 商家頁流程
    function renderPublicPage() {
      db.collection('site').doc('main').get().then(siteDoc => {
        const site = siteDoc.exists ? siteDoc.data() : {};
        // const siteHtml = renderSiteInfo(site); // 不顯示共用網站資料
        const uid = userParam;
        db.collection('users').doc(uid).get().then(doc => {
          let html = '';
          if (doc.exists && doc.data().vip) {
            const data = doc.data();
            // 設定 title 為 data.name | 公司名
            if (data.name && site.name) {
              document.title = data.name + ' | ' + site.name;
            } else if (data.name) {
              document.title = data.name;
            } else if (site.name) {
              document.title = site.name;
            }
            // 設定 favicon 為商家 logo
            if (data.logo) {
              let favicon = document.getElementById('dynamicFavicon');
              if (favicon) favicon.href = data.logo;
            }
            // 消費劵區塊
            if (Array.isArray(data.ads) && data.ads.length) {
              html += `<div id="couponsArea" style="display:flex;flex-direction:column;align-items:center;">`;
              data.ads.forEach(ad => {
                // 判斷 desc2 是否為網址
                let isUrl = ad.desc2 && /^https?:\/\//.test(ad.desc2);

                  ${ad.desc2 ? (

            // 彈窗顯示商家/網站資料
            html += `<div id="infoModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.5);z-index:9999;justify-content:center;align-items:center;">

            document.getElementById('main').innerHTML = html;
            callTranslate();
            // 彈窗遮罩點擊可關閉
            const infoModal = document.getElementById('infoModal');
            if (infoModal) {
              infoModal.onclick = function(e) {
                if (e.target === infoModal) infoModal.style.display = 'none';
              };

            // 彈窗顯示資料 function
            window.showShopInfo = function() {
              document.getElementById('infoContent').innerHTML = `

              document.getElementById('infoModal').style.display = 'flex';

                <div>${site.phone||''}</div>
                <div>${site.address||''}</div>

                <div>${site.desc||''}</div>

              document.getElementById('infoModal').style.display = 'flex';

          } else {
            html += '<div style="color:#888">商家準備中...</div>';
            document.getElementById('main').innerHTML = html;
          }
        }).catch(e => {
          document.getElementById('main').innerHTML = siteHtml + '<div style="color:red">資料載入失敗</div>';
          console.error('商家頁載入失敗', e);
        });
      });
    }

                #qrcode { width:100% !important; height:100% !important; display:block; }
                #showPrivacyBtn { background: #1e3a5c; color: #fff; border: none; }
                #showPrivacyBtn:active { background: #bfa046; color: #fff; }
                #logoAreaMember { display:flex;justify-content:space-between;align-items:center;width:100%;height:100px;margin:24px 0 0 0;background:linear-gradient(90deg,#e6e8ea 0%,#fffbe6 100%);border:2px solid #bfa046;box-shadow:0 2px 8px #bbb; }
                #memberLogoBox, #siteLogoBoxMember { flex:1;display:flex;justify-content:center;align-items:center;height:100%;cursor:pointer; }
                #memberLogoBox img, #siteLogoBoxMember img { max-height:80px;max-width:90%;object-fit:contain; }
              </style>
              <div id="memberMainWrap">
                <button id="loginBtn" style="display:none">Google登入</button>
                <div id="userPanel" style="display:none">
                  <button id="showPrivacyBtn">💰</button>
                  <div id="商家私隱" style="display:none">
                    <div>會員名字：<input id="name" type="text"></div>
                    <div>會員電話：<input id="phone" type="text"></div>
                    <div>會員地址：<input id="address" type="text"></div>
                    <div>會員logo網址：<input id="logo" type="text" style="width:60%"><span id="logoPreview"></span></div>
                    <div id="adsList"></div>
                    <button id="addAdBtn">新增廣告</button>
                    <div>VIP：<span id="vip"></span></div>

                    <div>本月發出消費劵數：<span id="month"></span></div>
                    <div>累計發出消費劵數：<span id="total"></span></div>
                    <div style="color:#bfa046;font-size:0.95em;">客戶每次使用相機掃qr獲取消費劵，店主將消費1元</div>
                    <button id="saveProfileBtn">儲存會員資料</button>
                    <button id="logoutBtn">登出</button>
                  </div>
                  <div id="qr位"><canvas id="qrcode"></canvas></div>
                </div>
                <div id="logoAreaMember">
                  <div id="memberLogoBox"></div>
                  <div id="siteLogoBoxMember"></div>
                </div>
                <div id="infoModalMember" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.5);z-index:9999;justify-content:center;align-items:center;">
                  <div id="infoContentMember" style="background:#fffbe6;border:3px solid #bfa046;padding:24px 32px;border-radius:16px;max-width:90vw;max-height:80vh;overflow:auto;box-shadow:0 4px 24px #222;position:relative;" onclick="event.stopPropagation();"></div>
                  <button onclick=\"document.getElementById('infoModalMember').style.display='none'\" style='position:absolute;top:12px;right:24px;font-size:32px;background:none;border:none;color:#bfa046;cursor:pointer;'>×</button>
                </div>
              </div>
            `;
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const userPanel = document.getElementById('userPanel');
            loginBtn.onclick = () => {
              const provider = new firebase.auth.GoogleAuthProvider();
              auth.signInWithPopup(provider);
            };
            logoutBtn.onclick = () => auth.signOut();
            // 商家私隱顯示按鈕
            const showPrivacyBtn = document.getElementById('showPrivacyBtn');
            const privacyPanel = document.getElementById('商家私隱');
            showPrivacyBtn.onclick = () => {
              if (privacyPanel.style.display === 'none' || privacyPanel.style.display === '') {
                privacyPanel.style.display = 'block';
              } else {
                privacyPanel.style.display = 'none';
              }
            };
            // user 已登入，開始取得 Firestore 資料
            const uid = user.uid;
            const userRef = db.collection('users').doc(uid);
            async function waitForUserDoc(retry = 0) {
              const doc = await userRef.get();
              if (!doc.exists) {
                document.getElementById('name').textContent = '帳號建立中，請稍候...';
                if (retry < 20) setTimeout(() => waitForUserDoc(retry + 1), 1000);
                return;
              }
              userPanel.style.display = '';
              loginBtn.style.display = 'none';
              privacyPanel.style.display = 'none';
              showPrivacyBtn.style.display = '';
              const nameInput = document.getElementById('name');
              const phoneInput = document.getElementById('phone');
              const addressInput = document.getElementById('address');
              const logoInput = document.getElementById('logo');
              const logoPreview = document.getElementById('logoPreview');
              const adsList = document.getElementById('adsList');
              const addAdBtn = document.getElementById('addAdBtn');
              const saveProfileBtn = document.getElementById('saveProfileBtn');

              phoneInput.value = data.phone || '';

              logoInput.value = data.logo || '';

                  const adsNow = getCurrentAds(adsList);
                  adsNow.splice(idx, 1);
                  renderAdsLoop(adsNow);
                });

              document.getElementById('total').textContent = data.total || 0;
              logoInput.oninput = () => {

                const ads = getCurrentAds(adsList);
                ads.push({img:'',title:'',desc1:'',desc2:''});

              saveProfileBtn.onclick = async () => {
                const newData = {
                  name: nameInput.value,
                  phone: phoneInput.value,
                  address: addressInput.value,
                  logo: logoInput.value,
                  ads: getCurrentAds(adsList)
                };

                try {
                  const updateUserProfile = firebase.functions().httpsCallable('updateUserProfile');
                  await updateUserProfile(newData);
                  alert('已儲存');
                } finally {
                  saveProfileBtn.disabled = false;
                  saveProfileBtn.textContent = '儲存會員資料';
                }

              siteLogoBox.innerHTML = siteData.logo ? `<img src='${siteData.logo}' alt='網站logo'>` : '';

              memberLogoBox.onclick = function() {
                document.getElementById('infoContentMember').innerHTML = `
                  <div style='font-size:2em;font-weight:bold;color:#bfa046;margin-bottom:8px;'>${data.name||''}</div>

                  <div>地址：${data.address||''}</div>
                  <div>logo：${data.logo?`<img src='${data.logo}' style='max-width:120px;'>`:''}</div>

                  <div>本月發出消費劵數：${data.month||0}</div>
                  <div>累計發出消費劵數：${data.total||0}</div>

                document.getElementById('infoModalMember').style.display = 'flex';
              };
              siteLogoBox.onclick = function() {
                document.getElementById('infoContentMember').innerHTML = `
                  <div style='font-size:2em;font-weight:bold;color:#1e3a5c;margin-bottom:8px;'>${siteData.name||''}</div>
                  <div>電話：${siteData.phone||''}</div>
                  <div>地址：${siteData.address||''}</div>
                  <div>logo：${siteData.logo?`<img src='${siteData.logo}' style='max-width:120px;'>`:''}</div>
                  <div>描述：${siteData.desc||''}</div>
                `;
                document.getElementById('infoModalMember').style.display = 'flex';
              };
              // 彈窗遮罩點擊可關閉（點內容不關閉）
              const infoModalMember = document.getElementById('infoModalMember');
              const infoContentMember = document.getElementById('infoContentMember');
              if (infoModalMember) {
                infoModalMember.onclick = function(e) {
                  if (e.target === infoModalMember) infoModalMember.style.display = 'none';
                };
                if (infoContentMember) {
                  infoContentMember.onclick = function(e) { e.stopPropagation(); };
                }
              }
              const qrDiv = document.getElementById('qr位');
              const qrcodeEl = document.getElementById('qrcode');
              if (data.vip) {
                let qrUrl = data.geturl || data.localGeturl || '';
                if (qrcodeEl.tagName === 'A') {
                  const newCanvas = document.createElement('canvas');
                  newCanvas.id = 'qrcode';
                  qrDiv.replaceChild(newCanvas, qrcodeEl);
                  setTimeout(() => QRCode.toCanvas(newCanvas, qrUrl), 0);
                } else {
                  qrcodeEl.style.display = '';
                  setTimeout(() => QRCode.toCanvas(qrcodeEl, qrUrl), 0);
                }
              } else {
                if (qrcodeEl.tagName === 'CANVAS') {
                  const a = document.createElement('a');
                  a.id = 'qrcode';
                  a.href = 'https://wa.me/85264071181/?text=莫生我要vip3';
                  a.textContent = '成為vip,派發您的消費劵，(客戶每次獲取消費劵，您將支付1元)';
                  a.target = '_blank';
                  qrDiv.replaceChild(a, qrcodeEl);
                } else {
                  qrcodeEl.style.display = '';
                  qrcodeEl.href = 'https://wa.me/85264071181/?text=莫生我要vip3';
                  qrcodeEl.textContent = '成為vip,派發您的消費劵，(客戶每次獲取消費劵，您將支付1元)';
                  qrcodeEl.target = '_blank';
                }
              }
            }
            waitForUserDoc();
          });
        } else {
          // 未登入顯示網站資料+登入按鈕
          db.collection('site').doc('main').get().then(doc => {
            var siteData = doc.exists ? doc.data() : {};
            let html = renderSiteInfo(siteData);
            html += `<button id="loginBtn">Google登入</button>`;
            document.getElementById('main').innerHTML = html;
            callTranslate();
            document.getElementById('loginBtn').onclick = () => {
              const provider = new firebase.auth.GoogleAuthProvider();
              auth.signInWithPopup(provider);
            };
          });
        }
      });
    }
