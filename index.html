// 將 ISO 時間字串轉為香港時間格式
function formatHKTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return isoStr;
  // 轉為香港時區（UTC+8）
  const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
  const hk = new Date(utc + 8 * 60 * 60000);
  const y = hk.getFullYear();
  const m = (hk.getMonth() + 1).toString().padStart(2, '0');
  const day = hk.getDate().toString().padStart(2, '0');
  const h = hk.getHours().toString().padStart(2, '0');
  const min = hk.getMinutes().toString().padStart(2, '0');
  const s = hk.getSeconds().toString().padStart(2, '0');
  return `${y}-${m}-${day} ${h}:${min}:${s}`;
}

];
async function addRegionsToFirestore() {
  const batch = db.batch();
  REGIONS.forEach(region => {
    const ref = db.collection('regions').doc(region);
    batch.set(ref, { name: region });
  });
  await batch.commit();
  alert('地區已寫入 Firestore');
}

// 依座標判斷香港18區
        function getHKRegionByLocation(lat, lng) {
            // 精確化的區域邊界定義
            if (lat > 22.28 && lat < 22.32 && lng > 114.14 && lng < 114.19) return '中西區';
            if (lat > 22.24 && lat < 22.28 && lng > 114.14 && lng < 114.23) return '南區';
            if (lat > 22.27 && lat < 22.29 && lng > 114.16 && lng < 114.19) return '灣仔區';
            if (lat > 22.27 && lat < 22.31 && lng > 114.19 && lng < 114.23) return '東區';
            if (lat > 22.30 && lat < 22.33 && lng > 114.16 && lng < 114.19) return '油尖旺區';
            if (lat > 22.32 && lat < 22.35 && lng > 114.14 && lng < 114.18) return '深水埗區';
            if (lat > 22.31 && lat < 22.34 && lng > 114.18 && lng < 114.20) return '九龍城區';
            if (lat > 22.33 && lat < 22.36 && lng > 114.19 && lng < 114.22) return '黃大仙區';
            if (lat > 22.31 && lat < 22.35 && lng > 114.21 && lng < 114.24) return '觀塘區';
            if (lat > 22.34 && lat < 22.38 && lng > 114.10 && lng < 114.14) return '葵青區';
            if (lat > 22.36 && lat < 22.40 && lng > 114.10 && lng < 114.14) return '荃灣區';
            if (lat > 22.38 && lat < 22.42 && lng > 113.95 && lng < 114.05) return '屯門區';
            if (lat > 22.42 && lat < 22.46 && lng > 114.00 && lng < 114.07) return '元朗區';
            if (lat > 22.50 && lat < 22.55 && lng > 114.12 && lng < 114.18) return '北區';
            if (lat > 22.43 && lat < 22.48 && lng > 114.15 && lng < 114.20) return '大埔區';
            if (lat > 22.35 && lat < 22.40 && lng > 114.18 && lng < 114.22) return '沙田區';
            if (lat > 22.30 && lat < 22.40 && lng > 114.25 && lng < 114.30) return '西貢區';
            if (lat > 22.25 && lat < 22.30 && lng > 113.85 && lng < 114.15) return '離島區';
            return '未知區域';
        }
// shop page 載入時自動定位並選擇地區
function autoSelectRegion() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos) {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const region = getHKRegionByLocation(lat, lng);
    if (region) {
      const regionSelect = document.getElementById('adRegionSelect');
      if (regionSelect) {
        for (let i = 0; i < regionSelect.options.length; i++) {
          if (regionSelect.options[i].value === region) {
            regionSelect.selectedIndex = i;
            regionSelect.dispatchEvent(new Event('change'));
            break;
          }
        }
      }
    }
  });
}

    // 商家頁流程
    function renderPublicPage() {
      // 彈窗遮罩點擊可關閉（點內容不關閉）
      setTimeout(function() {
        const adInfoModal = document.getElementById('adInfoModal');
        const adInfoContent = document.getElementById('adInfoContent');
        if (adInfoModal) {
          adInfoModal.onclick = function(e) {
            if (e.target === adInfoModal) adInfoModal.style.display = 'none';
          };
          if (adInfoContent) {
            adInfoContent.onclick = function(e) { e.stopPropagation(); };
          }
        }
      }, 0);

      // 取得 token 參數
      const params = new URLSearchParams(location.search);
      const tokenParam = params.get('token');
      const uid = userParam;
      db.collection('site').doc('main').get().then(siteDoc => {
        const site = siteDoc.exists ? siteDoc.data() : {};
        // 若網址帶有 token，需驗證有效性
        if (tokenParam) {
          db.collection('users').doc(uid).collection('tokens').doc(tokenParam).get().then(tokenDoc => {
            if (!tokenDoc.exists) {
              document.getElementById('main').innerHTML = '<div style="color:red;font-size:1.3em;margin:40px auto;text-align:center;">消費劵過期或無效，請重新掃描 QR code</div>';
              return;
            }
            const tokenData = tokenDoc.data();
            const now = new Date();
            const expireAt = tokenData.expireAt ? new Date(tokenData.expireAt) : null;
            if (!expireAt || now > expireAt) {
              document.getElementById('main').innerHTML = '<div style="color:red;font-size:1.3em;margin:40px auto;text-align:center;">消費劵過期，請重新掃描 QR code</div>';
              return;
            }
            // token 有效，顯示商家頁，並顯示過期時間
            renderShopPageWithExpiry(site, uid, expireAt);
          }).catch(e => {
            document.getElementById('main').innerHTML = '<div style="color:red;font-size:1.3em;margin:40px auto;text-align:center;">消費劵驗證失敗，請稍後再試</div>';
          });
        } else {
          // 沒有 token 參數，直接顯示商家頁（舊流程，僅供兼容）
          renderShopPageWithExpiry(site, uid, null);
        }
      });

      // 包裝原本商家頁渲染，增加過期時間顯示
      function renderShopPageWithExpiry(site, uid, expireAt) {
        db.collection('users').doc(uid).get().then(doc => {
          let html = '';
          if (doc.exists && doc.data().vip) {
            const data = doc.data();
            // 設定 title 為 data.name | 公司名
            if (data.name && site.name) {
              document.title = data.name + ' | ' + site.name;
            } else if (data.name) {
              document.title = data.name;
            } else if (site.name) {
              document.title = site.name;
            }
            // 設定 favicon 為會員 logo（如有）
            if (data.logo) {
              let favicon = document.getElementById('dynamicFavicon');
              if (favicon) favicon.href = data.logo;
            }
            // 顯示過期時間（如有）
            if (expireAt) {
              html += `<div style='color:var(--dark-gold);font-size:1.1em;text-align:center;margin:18px 0;'>本消費劵有效期至：${formatHKTime(expireAt.toISOString())}</div>`;
            }
            // ...原本內容...
            // 商家專屬消費劵區塊已移除
            // 公用廣告區塊（主內容渲染後再插入）
            // 取得所有類別與廣告，插入類別導航
            db.collection('categories').get().then(catSnap => {
              const categories = catSnap.docs.map(doc => doc.data().name);
              db.collection('ads').doc('main').get().then(adsDoc => {
                let adsArr = (adsDoc.exists && Array.isArray(adsDoc.data().ads)) ? adsDoc.data().ads : [];
                // 過濾下架時間
                const nowDate = new Date();
                adsArr = adsArr.filter(ad => {
                  if (!ad.expireDate) return true;
                  const expire = new Date(ad.expireDate + 'T00:00:00');
                  return expire > nowDate;
                });
                // shop page url 如有廣告主id，廣告主的廣告優先（原順序），其他廣告最新在前
                const urlParams = new URLSearchParams(window.location.search);
                const adOwnerId = urlParams.get('adOwner') || urlParams.get('owner') || urlParams.get('adowner') || urlParams.get('user');
                if (adOwnerId) {
                  // 1. 筛选广告主的广告 → 反转（让广告主的最后一条数据在最上）
                  const ownerAds = adsArr.filter(ad => ad.owner === adOwnerId).slice().reverse();
                  // 2. 筛选非广告主的广告 → 反转（让非广告主的最后一条数据在最上）
                  const otherAds = adsArr.filter(ad => ad.owner !== adOwnerId).slice().reverse();
                  // 3. 组合：广告主广告（已反转）在前，非广告主广告（已反转）在后
                  adsArr = [...ownerAds, ...otherAds];
                } else {
                  adsArr = adsArr.slice().reverse();
                }
                // shop page自動定位選區
                autoSelectRegion();

                // 搜尋欄與類別導航只建立一次
                let adsNavWrap = document.getElementById('adsNavWrap');
                if (!adsNavWrap) {
                  adsNavWrap = document.createElement('div');
                  adsNavWrap.id = 'adsNavWrap';
                  document.getElementById('main').insertAdjacentElement('afterbegin', adsNavWrap);

                  // 新增頂部導航
                  const topDiv = document.createElement('div');
                  topDiv.style = 'width:100%;max-width:720px;margin:auto;position:relative;';
                  adsNavWrap.appendChild(topDiv);

                  // 新增搜尋欄
                  const searchDiv = document.createElement('div');
                  searchDiv.style = 'display:flex;justify-content:center;;align-items:center;gap:8px;';
                  const kwInput = document.createElement('input');
                  kwInput.id = 'adKeywordInput';
                  kwInput.type = 'text';
                  kwInput.placeholder = '輸入關鍵字搜尋';
                  kwInput.style = 'font-size:1.1em;padding:6px 12px;border-radius:8px;border:1.5px solid var(--dark-gold);background:#fffbe6;color:#1e3a5c;width:100%;';

    // 付款方式管理
    function renderPaymentMethods(user, wrap) {
      wrap.innerHTML = '<h2>付款方式管理</h2>';
      let methods = Array.isArray(user.paymentMethods) ? user.paymentMethods : [];
      methods.forEach((pm, idx) => {
        const div = document.createElement('div');
        div.style = 'display:flex;align-items:center;gap:8px;margin-bottom:8px;';
        div.innerHTML = `
          <input type='text' value='${pm.name||''}' placeholder='付款方式名' style='width:60%;padding:4px 8px;border-radius:6px;border:1px solid #ccc;'>
          <input type='text' value='${pm.img||''}' placeholder='圖片網址' style='width:30%;padding:4px 8px;border-radius:6px;border:1px solid #ccc;'>
          <img src='${pm.img||''}' style='height:32px;width:32px;object-fit:contain;border-radius:6px;border:1px solid #eee;' onerror="this.style.display='none'">
          <button class='delPayBtn delete-btn' data-idx='${idx}' >刪除</button>
        `;
        wrap.appendChild(div);
      });
      // 新增按鈕
      const addBtn = document.createElement('button');
      addBtn.textContent = '+';
      addBtn.className  = 'add-Btn';
      addBtn.onclick = function(){
        methods.push({name:'',img:''});
        user.paymentMethods = methods;
        renderPaymentMethods(user, wrap);
      };
      wrap.appendChild(addBtn);
      // 刪除事件
      wrap.querySelectorAll('.delPayBtn').forEach(btn => {
        btn.onclick = function(){
          const idx = parseInt(btn.getAttribute('data-idx'));
          methods.splice(idx,1);
          user.paymentMethods = methods;
          renderPaymentMethods(user, wrap);
        };
      });
    }





function savePaymentMethods(uid, Box位) {
  const wrap = document.getElementById(Box位);
  // 只選有兩個 input 的 div
  const items = Array.from(wrap.querySelectorAll('div')).filter(div => div.querySelectorAll('input').length === 2);
  const methods = items.map(div => {
    const inputs = div.querySelectorAll('input');
    return { name: inputs[0]?.value || '', img: inputs[1]?.value || '' };
  }).filter(pm => pm.name || pm.img);
  return db.collection('users').doc(uid).update({ paymentMethods: methods });
}
function injectPaymentMethodsUI(uid, Box位) {
  const privDiv = document.getElementById(Box位);
  if (!privDiv) return;
  let pmWrap = document.getElementById('paymentMethodsWrap_' + uid);
  if (!pmWrap) {
    pmWrap = document.createElement('div');
    pmWrap.id = 'paymentMethodsWrap_' + uid;
    pmWrap.style = 'margin:18px 0 12px 0;padding:12px;border-radius:12px;background:var(--3-gold);box-shadow:0 2px 8px #bbb;';
    privDiv.appendChild(pmWrap);
    const title = document.createElement('div');

    title.style = 'font-size:1.2em;font-weight:bold;color:var(--dark-gold);margin-bottom:8px;';

  }
  db.collection('users').doc(uid).get().then(doc => {
    const userData = doc.exists ? doc.data() : {};
    renderPaymentMethods(userData, pmWrap);
  });
}

        // 计算上架天数
        function calculateDays(groupId) {
            const group = document.getElementById(`group-${groupId}`);
            if (!group) return; // 确保组存在
            
            const startDateInput = group.querySelector('.input5');
            const endDateInput = group.querySelector('.input6');
            const daysInput = group.querySelector('.input7');
            
            if (startDateInput && endDateInput && daysInput && 
                startDateInput.value && endDateInput.value) {
                const startDate = new Date(startDateInput.value);
                const endDate = new Date(endDateInput.value);
                
                // 计算天数差
                const timeDiff = endDate.getTime() - startDate.getTime();
                const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24)) + 1; // 加1是因为包含开始日期
                
                daysInput.value = `${daysDiff} 天`;
            } else if (daysInput) {
                daysInput.value = '';
            }
        }
