        .items-grid {

            background: var(--color-surface);

            box-shadow: var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s;

            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .exchange-btn:hover {
            background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-primary) 100%);
            box-shadow: 0 4px 12px rgba(15, 43, 91, 0.3);
        }

        // 生成兌換品列表
        function generateExchangeItems() {
            
            
            
            auth.onAuthStateChanged(async user => {
        if (user) {
          // 取得會員all料
          const uid = user.uid;
          const userRef = db.collection('users').doc(uid);
          const doc = await userRef.get();
          if (doc.exists) {

            document.getElementById('當前的聯盟幣餘額').innerHTML = `

            </a>
            `

            const container = document.getElementById('exchange-items');
            // 清空容器
            container.innerHTML = '';
            
            // 生成每個兌換品卡片
            exchangeItems.forEach(item => {
                const canAfford = data.ssgtotalCoins >= item.cost;
                
                const itemCard = document.createElement('div');
                itemCard.className = 'item-card';
                
                itemCard.innerHTML = `
                    <div class="item-image">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        <div class="item-description">${item.description}</div>
                        <div class="item-cost">

                        </a>
                    </div>
                `;
                
                container.appendChild(itemCard);
            });

          }
        }
