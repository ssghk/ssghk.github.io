    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const authArea = document.getElementById('authArea');
    const treeArea = document.getElementById('treeArea');

    loginBtn.onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider);
    };
    logoutBtn.onclick = () => auth.signOut();

    auth.onAuthStateChanged(async user => {
      if (user) {
        authArea.style.display = 'none';
        logoutBtn.style.display = '';
        treeArea.style.display = '';
        treeArea.innerHTML = '<div>載入中...</div>';
        const uid = user.uid;
        // 查詢所有 users
        const usersSnap = await db.collection('users').get();
        const users = {};
        usersSnap.forEach(doc => users[doc.id] = doc.data());
        // 構建推薦樹
        function buildTree(currentUid, users, maxDepth = 99, depth = 0, visited = new Set()) {
          if (!users[currentUid] || depth > maxDepth || visited.has(currentUid)) return null;
          visited.add(currentUid);
          const node = {
            uid: currentUid,
            name: users[currentUid].name || '',
            owner: users[currentUid].owner || '',
            email: users[currentUid].email || '',

            total: users[currentUid].total || '',


            children: []
          };
          // 找下線
          for (const [id, u] of Object.entries(users)) {
            if (u.owner === currentUid) {
              const child = buildTree(id, users, maxDepth, depth + 1, visited);
              if (child) node.children.push(child);
            }
          }
          return node;
        }
        // 找上線鏈
        function getOwnerChain(uid, users) {
          const chain = [];
          let cur = uid;
          const visited = new Set();
          while (users[cur] && users[cur].owner) {
            const ownerId = users[cur].owner;
            if (!users[ownerId] || visited.has(ownerId)) break;
            chain.push({ uid: ownerId, name: users[ownerId].name || '', email: users[ownerId].email || '', total: users[ownerId].total || '' });
            visited.add(ownerId);
            cur = ownerId;
            if (chain.length > 20) break; // 防止死循環
          }
          return chain;
        }
        // 畫樹
        function renderTree(node, isSelf = false) {
          if (!node) return '';
          let html = `<li>
            <span class="${isSelf ? 'self' : 'downline'}">
              ${node.name || '(無名)'}
              <span class="uid">(${node.email})</span>
              <span class="uid" title="累計使用次數"> ${node.total} </span>
            </span><br><br>`;
          if (node.children.length) {
            html += '<ul>' + node.children.map(child => renderTree(child)).join('') + '</ul>';
          }
          html += '</li>';
          return html;
        }
        // 畫上線
        function renderOwnerChain(chain, selfUid) {
          if (!chain.length) return '<li>（無推薦人）</li>';
          return chain.map((o, i) => `<li><span class="owner">${o.name || '(無名)'} <span class="uid">(${o.email})</span></span>${i === 0 ? ' ← 推薦人' : ''}</li>`).join('');
        }
        // 畫出
        const selfNode = buildTree(uid, users);
        const ownerChain = getOwnerChain(uid, users);
        treeArea.innerHTML = `
          <ul>${renderOwnerChain(ownerChain, uid)}</ul>
          <ul class="tree">${renderTree(selfNode, true)}</ul>
        `;
      } else {
        authArea.style.display = '';
        logoutBtn.style.display = 'none';
        treeArea.style.display = 'none';
      }
    });
