.Shop頁加入btn {
            display: block;
            margin: 40px auto 0 auto;

            padding: 16px 40px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, var(--dark-gold) 0%, var(--gold) 100%);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 12px rgba(187, 187, 187, 0.6);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
/* 添加第二種金屬效果 */
        .metallic-shine-2 {
            background: linear-gradient(
                125deg,
                var(--dark-gold) 0%,
                #f9e8a1 25%,
                var(--dark-gold) 50%,
                #f9e8a1 75%,
                var(--dark-gold) 100%
            );
            background-size: 200% 200%;
            animation: gradient-shift 4s infinite;
        }
        /* 懸停效果 */
        .Shop頁加入btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 16px rgba(187, 187, 187, 0.8);
        }

        .Shop頁加入btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 6px rgba(187, 187, 187, 0.6);
        }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }


    </style>

    script.onload = function() {
      window.onload = function() {
  const payList = document.getElementById('payList');
  const payTitle = document.getElementById('payTitle');
  const 消費劵鍵 = document.getElementById('消費劵鍵');
        const db = firebase.firestore();
        // 取得 uid
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        if (!uid) {
          window.location.href = 'about.html';
          return;
        }
        payList.innerHTML = '<div style="text-align:center;color:var(--dark-gold);">請稍候...</div>';
        // 呼叫 payIncrementCount Cloud Function
        if (!firebase.functions) {
          payList.innerHTML = '<div style="color:red;text-align:center;">Cloud Function 未載入</div>';
          return;
        }
        const payIncrementCount = firebase.functions().httpsCallable('payIncrementCount');
        payIncrementCount({ uid }).then(result => {
          console.log('payIncrementCount result:', result);
          db.collection('users').doc(uid).get().then(doc => {
            if (!doc.exists) { payList.innerHTML = '<div style="color:red;text-align:center;">查無此會員</div>'; payTitle.textContent = '查無此會員'; return; }
            const data = doc.data();
            payTitle.textContent = (data.name ? data.name : '會員');
            const methods = Array.isArray(data.paymentMethods) ? data.paymentMethods : [];

            // 產生 token 並帶入連結
              const createTokenForUser = firebase.functions().httpsCallable('createTokenForUser');
              createTokenForUser({ uid }).then(tokenResult => {
                const token = tokenResult.data.token;

                if (!methods.length) { 
                  //此會員尚未設定付款方式
                  window.location.href = `index.html?user=${uid}&token=${token}`;
                }
                消費劵鍵.innerHTML = `<a href="index.html?get=${uid}&token=${token}" target="_blank" class="Shop頁加入btn metallic-shine-2 ">街坊聯盟消費劵</a>`;
              }).catch(e => {
                消費劵鍵.innerHTML = '<div style="color:red;text-align:center;">產生消費劵失敗</div>';
              });
              // 顯示付款方式
            payList.innerHTML = methods.map(pm => `
              <div class="pay-item">
                <span class="pay-name">${pm.name||''}</span>
                <img class="pay-img" src="${pm.img||''}" alt="${pm.name||''}" onerror="this.style.display='none'">
              </div>
            `).join('');

          }).catch(e => {
            //payList.innerHTML = '<div style="color:red;text-align:center;">查詢失敗</div>';
            //payTitle.textContent = '查詢失敗';
            console.error('Firestore get error:', e);
            window.location.href = 'about.html';
          });
        }).catch(e => {
          
          //payList.innerHTML = '<div style="color:red;text-align:center;">計數失敗：' + (e.message || e) + '</div>';
          console.error('payIncrementCount error:', e);
          window.location.href = 'about.html';
        });
      }
