    script.onload = function() {
      window.onload = function() {
  const payList = document.getElementById('payList');
  const payTitle = document.getElementById('payTitle');
  const 消費劵鍵 = document.getElementById('消費劵鍵');
        const db = firebase.firestore();
        // 取得 uid
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        if (!uid) {
          window.location.href = 'about.html';
          return;
        }
        payList.innerHTML = '<div style="text-align:center;color:#bfa046;">請稍候...</div>';
        // 呼叫 payIncrementCount Cloud Function
        if (!firebase.functions) {
          payList.innerHTML = '<div style="color:red;text-align:center;">Cloud Function 未載入</div>';
          return;
        }
        const payIncrementCount = firebase.functions().httpsCallable('payIncrementCount');
        payIncrementCount({ uid }).then(result => {
          console.log('payIncrementCount result:', result);
          db.collection('users').doc(uid).get().then(doc => {
            if (!doc.exists) { payList.innerHTML = '<div style="color:red;text-align:center;">查無此會員</div>'; payTitle.textContent = '查無此會員'; return; }
            const data = doc.data();
            payTitle.textContent = (data.name ? data.name : '會員');
            const methods = Array.isArray(data.paymentMethods) ? data.paymentMethods : [];
            if (!methods.length) { 
              //payList.innerHTML = '<div style="color:#888;text-align:center;">此會員尚未設定付款方式</div>'; return;
              window.location.href = 'index.html?user='+uid;
             }
            payList.innerHTML = methods.map(pm => `
              <div class="pay-item">
                <span class="pay-name">${pm.name||''}</span>
                <img class="pay-img" src="${pm.img||''}" alt="${pm.name||''}" onerror="this.style.display='none'">
              </div>
            `).join('');
            消費劵鍵.innerHTML = `<a href="index.html?user=${uid}" target="_blank">街坊聯盟消費劵</a>`;
          }).catch(e => {
            //payList.innerHTML = '<div style="color:red;text-align:center;">查詢失敗</div>';
            //payTitle.textContent = '查詢失敗';
            console.error('Firestore get error:', e);
            window.location.href = 'about.html';
          });

          console.error('payIncrementCount error:', e);
          window.location.href = 'about.html';
